<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тетрис</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: white;
      background: #111;
      font-family: sans-serif;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 12px auto;
      border: 2px solid white;
      background: black;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Тетрис</h1>
    <div>Счёт: <span id="score">0</span></div>
    <canvas id="game" width="240" height="400"></canvas>
    <div>← → двигать · ↑ вращать · ↓ ускорить</div>
    <p><button onclick="start()">Новая игра</button></p>
  </main>

  <script>
    const canvas = document.querySelector('#game');
    const context = canvas.getContext('2d');
    const scoreElement = document.querySelector('#score');
    const size = 20;
    const width = 12;
    const height = 20;
    const colors = ['#000', '#0ff', '#ff0', '#a0f', '#0f0', '#f00', '#00f', '#f80'];
    const shapes = [
      [[1, 1, 1, 1]],
      [[2, 2], [2, 2]],
      [[0, 3, 0], [3, 3, 3]],
      [[0, 4, 4], [4, 4, 0]],
      [[5, 5, 0], [0, 5, 5]],
      [[6, 0, 0], [6, 6, 6]],
      [[0, 0, 7], [7, 7, 7]]
    ];

    let board;
    let piece;
    let score;
    let timer;

    function newPiece() {
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      piece = { shape, x: 4, y: 0 };

      if (collides()) {
        clearInterval(timer);
        alert(`Игра окончена. Счёт: ${score}`);
      }
    }

    function collides() {
      return piece.shape.some((row, y) => row.some((cell, x) => {
        if (!cell) return false;
        const boardX = piece.x + x;
        const boardY = piece.y + y;
        return boardX < 0 || boardX >= width || boardY >= height ||
          (boardY >= 0 && board[boardY][boardX]);
      }));
    }

    function merge() {
      piece.shape.forEach((row, y) => row.forEach((cell, x) => {
        if (cell) board[piece.y + y][piece.x + x] = cell;
      }));

      for (let y = height - 1; y >= 0; y--) {
        if (board[y].every(Boolean)) {
          board.splice(y, 1);
          board.unshift(Array(width).fill(0));
          score += 100;
          scoreElement.textContent = score;
          y++;
        }
      }

      newPiece();
    }

    function move(dx, dy) {
      piece.x += dx;
      piece.y += dy;

      if (collides()) {
        piece.x -= dx;
        piece.y -= dy;
        if (dy) merge();
      }

      draw();
    }

    function rotate() {
      const oldShape = piece.shape;
      piece.shape = oldShape[0].map((_, x) => oldShape.map(row => row[x]).reverse());
      if (collides()) piece.shape = oldShape;
      draw();
    }

    function drawCell(x, y, color) {
      context.fillStyle = colors[color];
      context.fillRect(x * size, y * size, size - 1, size - 1);
    }

    function draw() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      board.forEach((row, y) => row.forEach((cell, x) => {
        if (cell) drawCell(x, y, cell);
      }));
      piece.shape.forEach((row, y) => row.forEach((cell, x) => {
        if (cell) drawCell(piece.x + x, piece.y + y, cell);
      }));
    }

    function start() {
      clearInterval(timer);
      board = Array.from({ length: height }, () => Array(width).fill(0));
      score = 0;
      scoreElement.textContent = score;
      newPiece();
      draw();
      timer = setInterval(() => move(0, 1), 500);
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') move(-1, 0);
      if (event.key === 'ArrowRight') move(1, 0);
      if (event.key === 'ArrowDown') move(0, 1);
      if (event.key === 'ArrowUp') rotate();
      if (event.key.startsWith('Arrow')) event.preventDefault();
    });

    start();
  </script>
</body>
</html>
